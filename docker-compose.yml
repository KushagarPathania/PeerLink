# Optional: a local PostgreSQL for development, for those who prefer Docker over a native install.
# Reads credentials from .env in this directory.
services:
  postgres:
    image: postgres:16-alpine
    container_name: peerlink-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peerlink}
      POSTGRES_USER: ${DB_USERNAME:-peerlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - peerlink-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  peerlink-pgdata:
